{% extends 'base.html' %}
{% block title %}Hồ sơ · FoodNow{% endblock %}
{% block content %}
<section class="panel">
  <div class="wrap">
    <h1>Hồ sơ của tôi</h1>
    <dl class="facts">
      <dt>Tên đăng nhập</dt><dd>{{ user.username }}</dd>
      <dt>Email</dt><dd>{{ user.email|default:"(chưa có)" }}</dd>
      <dt>Ngày tham gia</dt><dd>{{ user.date_joined|date:"d/m/Y" }}</dd>
    </dl>
  </div>
</section>
{% endblock %}
