{% extends 'base.html' %}
{% block title %}Hồ sơ · FoodNow{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Hồ sơ của tôi</h1>
<dl class="row">
  <dt class="col-sm-3">Tên đăng nhập</dt><dd class="col-sm-9">{{ user.username }}</dd>
  <dt class="col-sm-3">Email</dt><dd class="col-sm-9">{{ user.email|default:"(chưa có)" }}</dd>
  <dt class="col-sm-3">Ngày tham gia</dt><dd class="col-sm-9">{{ user.date_joined|date:"d/m/Y" }}</dd>
</dl>
{% endblock %}
