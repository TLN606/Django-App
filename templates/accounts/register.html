{% extends 'base.html' %}
{% block title %}Đăng ký · FoodNow{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h3 mb-3">Đăng ký</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button class="btn btn-dark mt-2" type="submit">Tạo tài khoản</button>
    </form>
    <p class="mt-3">Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a></p>
  </div>
</div>
{% endblock %}
