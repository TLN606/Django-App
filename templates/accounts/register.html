{% extends 'base.html' %}
{% block title %}Đăng ký · FoodNow{% endblock %}
{% block content %}
<section class="panel">
  <div class="wrap">
    <div class="narrow">
      <h1>Đăng ký</h1>
      <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_div }}
        <button class="btn" type="submit">Tạo tài khoản</button>
      </form>
      <p class="alt">Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a></p>
    </div>
  </div>
</section>
{% endblock %}
