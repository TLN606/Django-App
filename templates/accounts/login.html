{% extends 'base.html' %}
{% block title %}Đăng nhập · FoodNow{% endblock %}
{% block content %}
<section class="panel">
  <div class="wrap">
    <div class="narrow">
      <h1>Đăng nhập</h1>
      <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_div }}
        <button class="btn" type="submit">Đăng nhập</button>
      </form>
      <p class="alt">Chưa có tài khoản? <a href="{% url 'register' %}">Đăng ký</a></p>
    </div>
  </div>
</section>
{% endblock %}
