{% extends 'base.html' %}
{% block title %}Đăng nhập · FoodNow{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h3 mb-3">Đăng nhập</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button class="btn btn-dark mt-2" type="submit">Đăng nhập</button>
    </form>
    <p class="mt-3">Chưa có tài khoản? <a href="{% url 'register' %}">Đăng ký</a></p>
  </div>
</div>
{% endblock %}
