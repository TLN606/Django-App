{% extends 'base.html' %}
{% block content %}
<h1 class="h3 mb-3">Thực đơn</h1>
<div class="row g-3">
  {% for dish in dishes %}
    <div class="col-6 col-md-4 col-lg-3">
      <div class="card h-100">
        {% if dish.image %}<img src="{{ dish.image.url }}" class="card-img-top" alt="{{ dish.name }}">{% endif %}
        <div class="card-body">
          <h2 class="h6 card-title">{{ dish.name }}</h2>
          <p class="text-muted small mb-1">{{ dish.category }}</p>
          <p class="fw-bold mb-0">{{ dish.price|floatformat:0 }}đ</p>
        </div>
      </div>
    </div>
  {% empty %}
    <p class="text-muted">Chưa có món nào. Thêm món trong trang admin.</p>
  {% endfor %}
</div>
{% endblock %}
